<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60">
  <!-- Blue band -->
  <rect width="120" height="30" fill="#0038A8" />
  <!-- Red band -->
  <rect width="120" height="30" y="30" fill="#CE1126" />
  <!-- White triangle -->
  <polygon points="0,0 51.96,30 0,60" fill="#FFFFFF" />
  
  <!-- Sun and Rays -->
  <g transform="translate(17.32, 30)" fill="#FCD116">
    <!-- Main circle -->
    <circle r="4" />
    <!-- 8 rays -->
    <polygon points="-1,-7 0,-9 1,-7" />
    <polygon points="-1,7 0,9 1,7" />
    <polygon points="7,-1 9,0 7,1" />
    <polygon points="-7,-1 -9,0 -7,1" />
    
    <polygon points="5,-5 6.36,-6.36 5,-6.36" />
    <polygon points="5,5 6.36,6.36 5,6.36" />
    <polygon points="-5,-5 -6.36,-6.36 -5,-6.36" />
    <polygon points="-5,5 -6.36,6.36 -5,6.36" />
  </g>
  
  <!-- 3 Stars -->
  <g fill="#FCD116">
    <!-- Top-left -->
    <polygon points="5,3 6,5 8,5 6,6.5 7,8.5 5,7 3,8.5 4,6.5 2,5 4,5" />
    <!-- Bottom-left -->
    <polygon points="5,51 6,53 8,53 6,54.5 7,56.5 5,55 3,56.5 4,54.5 2,53 4,53" />
    <!-- Right -->
    <polygon points="45,28 46,30 48,30 46,31.5 47,33.5 45,32 43,33.5 44,31.5 42,30 44,30" />
  </g>
</svg>
